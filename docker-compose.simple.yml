version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # No volume mounts - everything is copied into container
    environment:
      - DEBUG=1
      - DATABASE_URL=sqlite:///app/db.sqlite3
    command: >
      sh -c "python manage.py makemigrations ciclovias &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # PostgreSQL database (for future use)
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bikeproject
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: